[package]
name = "modbus-tool"
version = "0.2.0"
description = "Lightweight Modbus master, slave simulator and packet monitor"
authors = ["zoneBen"]
edition = "2024"
publish = false

[lib]
name = "modbus_tool_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
modbus-core = { path = "../crates/modbus-core" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util"] }
serialport = "4"
ipnet = "2"
futures = "0.3"
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
