[package]
name = "modbus-tool"
version = "0.5.0"
description = "Lightweight Modbus master, slave simulator and packet monitor"
authors = ["zoneBen"]
edition = "2024"
publish = false

[lib]
name = "modbus_tool_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
modbus-core = { path = "../crates/modbus-core" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util", "fs"] }
serialport = "4"
ipnet = "2"
futures = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "json", "charset", "gzip", "brotli", "http2", "system-proxy"] }
hickory-resolver = "0.24"
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"
crc32fast = "1"
hex = "0.4"
walkdir = "2"
regex = "1"
globset = "0.4"
encoding_rs = "0.8"
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_NetworkManagement_IpHelper",
  "Win32_Networking_WinSock",
  "Win32_Security",
  "Win32_System_Threading",
] }
ipconfig = "0.3"
libloading = "0.8"
