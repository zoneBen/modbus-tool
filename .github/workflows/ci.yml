name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows:
    name: Windows · frontend + Rust
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test:unit

      - name: Format check
        run: pnpm format:check

      # tauri::generate_context! embeds frontendDist at compile time, so the
      # production bundle must exist before clippy/tests compile the app crate.
      - name: Build frontend
        run: pnpm build

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Rust format
        run: cargo fmt --all --check

      - name: Clippy
        shell: bash
        run: |
          set +e
          cargo clippy --workspace --all-targets -- -D warnings > clippy.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            head -n 40 clippy.log | while IFS= read -r line; do
              line="${line//$'\r'/}"
              printf '::error title=Clippy::%s\n' "$line"
            done
          fi
          tail -n 80 clippy.log
          exit "$status"

      - name: Rust tests
        run: cargo test --workspace
