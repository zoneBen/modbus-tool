name: Release Windows

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows installers and portable
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      # Small installers: rely on the system WebView2 runtime.
      - name: Build online WebView2 installers
        run: pnpm tauri build --bundles nsis,msi

      - name: Stage online WebView2 installers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          shopt -s nullglob
          for file in target/release/bundle/nsis/*.exe; do
            base="$(basename "$file" .exe)"
            cp "$file" "release-assets/${base}-online-webview.exe"
          done
          for file in target/release/bundle/msi/*.msi; do
            base="$(basename "$file" .msi)"
            cp "$file" "release-assets/${base}-online-webview.msi"
          done
          rm -rf target/release/bundle

      # Offline installers: include the WebView2 offline runtime for LTSC / air-gapped PCs.
      - name: Build offline WebView2 installers
        run: pnpm tauri build --bundles nsis,msi --config src-tauri/tauri.offline-webview.conf.json

      - name: Stage offline WebView2 installers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          shopt -s nullglob
          for file in target/release/bundle/nsis/*.exe; do
            base="$(basename "$file" .exe)"
            cp "$file" "release-assets/${base}-offline-webview.exe"
          done
          for file in target/release/bundle/msi/*.msi; do
            base="$(basename "$file" .msi)"
            cp "$file" "release-assets/${base}-offline-webview.msi"
          done

      # Portable package: unzip and run. Uses the system WebView2 runtime.
      - name: Build portable package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path portable | Out-Null
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          Copy-Item "target/release/modbus-tool.exe" "portable/modbus-tool.exe"
          Get-ChildItem "target/release" -Filter "*.dll" -File -ErrorAction SilentlyContinue |
            Copy-Item -Destination "portable"
          $readme = @"
          Modbus Tool ${{ github.ref_name }} 便携版
          =========================================

          1. 解压整个文件夹到任意目录。
          2. 双击 modbus-tool.exe 运行，无需安装。
          3. 便携版依赖系统 WebView2 Runtime。Windows 10/11 通常已自带；
             如无法启动，请安装微软 WebView2 Runtime，或改用 offline-webview 安装包。

          配置仍保存在当前 Windows 用户的应用数据目录中；删除程序即可卸载。
          "@
          [System.IO.File]::WriteAllText(
            (Join-Path (Get-Location) "portable/README-portable.txt"),
            $readme,
            (New-Object System.Text.UTF8Encoding($false))
          )
          Compress-Archive -Path "portable/*" -DestinationPath "release-assets/Modbus-Tool-${{ github.ref_name }}-portable-x64.zip" -Force

      - name: List release assets
        shell: bash
        run: |
          echo "Release assets:"
          ls -lh release-assets

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: modbus-tool-windows-all
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

      - name: Publish draft release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Modbus Tool ${{ github.ref_name }}
          draft: true
          prerelease: false
          body: |
            Windows 构建产物：

            - `*-online-webview.exe` / `*-online-webview.msi`：小体积安装包，使用系统 WebView2 Runtime（Windows 10/11 通常已自带）。
            - `*-offline-webview.exe` / `*-offline-webview.msi`：内置离线 WebView2 Runtime，适合无外网、LTSC 或工控机。
            - `Modbus-Tool-${{ github.ref_name }}-portable-x64.zip`：绿色便携版，解压后运行 `modbus-tool.exe`，需要系统 WebView2 Runtime。

            便携版不写注册表、不创建服务；配置文件仍保存在当前 Windows 用户的应用数据目录中。
          files: release-assets/*

      # Later, when macOS/Linux are ready, add a matrix:
      # - macos-latest (aarch64-apple-darwin, x86_64-apple-darwin)
      # - ubuntu-22.04 (needs libwebkit2gtk-4.1-dev, libudev-dev, librsvg2-dev, patchelf)
      # and keep Windows as the first validated target.
